# 打 tag（v*）自动构建并发布 Release：TermHub-x.y.z.dmg / .zip
# 手动触发(workflow_dispatch)仅做构建冒烟，不发布
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: 构建（release + ad-hoc 签名）
        run: ./scripts/build-app.sh release

      - name: 打包 dmg / zip
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="dev-${GITHUB_SHA:0:7}"
          fi
          ditto -c -k --keepParent build/TermHub.app "TermHub-${VERSION}.zip"
          hdiutil create -volname TermHub -srcfolder build/TermHub.app -ov -format UDZO "TermHub-${VERSION}.dmg"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: 创建 GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "TermHub-${VERSION}.zip" "TermHub-${VERSION}.dmg" \
            --title "TermHub ${GITHUB_REF_NAME}" \
            --notes "下载 dmg 拖入应用程序文件夹即可。ad-hoc 签名：首次打开请右键→打开（或系统设置允许）。Homebrew：brew install --cask https://raw.githubusercontent.com/ley-Ning/mac-termhub/main/Casks/termhub.rb"
